name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci-macos:
    name: CI (macOS, pnpm)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (with pnpm from packageManager field)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          package_manager: pnpm
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run validation
        run: pnpm run validate

      - name: Run tests
        run: pnpm test

      - name: Verify documentation mirror
        run: pnpm run check:docs

      - name: Dry-run npm pack
        run: npm pack --dry-run --json --cache "$RUNNER_TEMP/npm-cache"

      - name: Ensure clean git diff
        run: git diff --exit-code

  ci-windows:
    name: CI (Windows, pnpm)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (with pnpm from packageManager field)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          package_manager: pnpm
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check fork formatting
        shell: bash
        run: pnpm run format:check

      - name: Typecheck fork plugins
        shell: bash
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Verify documentation mirror
        shell: bash
        run: pnpm run check:docs

      - name: Dry-run npm pack
        shell: bash
        run: npm pack --dry-run --json --cache "$RUNNER_TEMP/npm-cache"

      - name: Ensure clean git diff
        run: git diff --exit-code

  npm-compat:
    name: npm compatibility (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies with npm
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Verify documentation mirror
        run: npm run check:docs
